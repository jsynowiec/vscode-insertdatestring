on:
    release:
        types: [released]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ github.event.release.tag_name }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".node-version"
            - run: npm ci
            - run: npx @vscode/vsce publish --oidc
